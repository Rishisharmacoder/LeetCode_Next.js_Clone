services:
  postgres:
    image: postgres:18
    container_name: leetcode_db
    environment:
      POSTGRES_DB: leetcode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5435:5432"
    volumes:
      - leetcode_db_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  leetcode_db_data: